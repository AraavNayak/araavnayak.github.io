<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Araav Nayak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h2 style="margin-top: 60px; text-align: center; font-size: 40px; ">Projects</h2>

        <div class="container" style="padding-bottom: 50px;">
            <div class="prior-education">
                <div class="prior-education-grid" id="projects-container" style="justify-content: center;">
                    <!--Content is loaded from js script-->
                    
                </div>
            </div>
            
        </div>







    <script src="nav.js"></script>
    <script src="projects.js"></script>
</body>
</html>


<script>


    async function loadProjects() {
        // Prefer the inlined global (works when opened via file://), fall back to fetch.
        if (Array.isArray(window.PROJECTS)) {
            renderProjects(window.PROJECTS);
            return;
        }
        try {
            const response = await fetch('projects.json');
            const projects = await response.json();
            renderProjects(projects);
        } catch (error) {
            console.error('Error loading projects:', error);
        }
    }



    function renderProjects(projects) {
        const container = document.getElementById('projects-container');
        
        // Create placeholder elements for all projects
        projects.forEach((project, index) => {
            const placeholder = document.createElement('div');
            placeholder.className = 'project-placeholder';
            placeholder.dataset.index = index;
            placeholder.dataset.loaded = 'false';
            container.appendChild(placeholder);
        });

        // Set up Intersection Observer for lazy loading
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && entry.target.dataset.loaded === 'false') {
                    const index = parseInt(entry.target.dataset.index);
                    const project = projects[index];
                    
                    // Replace placeholder with actual content
                    const projectHTML = `
                        <div class="education-card-small project-card" id="project-card">
                            <div class="image-card-small">
                                <img src="${project.image}" alt="${project.title}">
                            </div>

                            <div class="education-info">
                                <div class="card-header">
                                    <h3>${project.title}</h3>
                                    
                                </div>
                                <p class="muted">${project.date}</p>
                            </div>

                            <div class="project-desc degree">
                                <p>${project.description}</p>
                            </div>
                            <div class="course-tags">
                                ${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                            </div>

                            ${project.github ? `<a href="${project.github}" class="github-link" target="_blank" rel="noopener noreferrer" aria-label="Open project link"></a>` : ''}
                        </div>
                    `;
                    
                    entry.target.outerHTML = projectHTML;
                }
            });
        }, {
            root: null,
            rootMargin: '50px',
            threshold: 0
        });

        // Observe all placeholders
        const placeholders = container.querySelectorAll('.project-placeholder');
        placeholders.forEach(placeholder => observer.observe(placeholder));
    }

    document.addEventListener('DOMContentLoaded', loadProjects);

</script>
