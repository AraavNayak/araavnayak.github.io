<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Involvement | Araav Nayak</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            color-scheme: dark;
            --campus-text: #f8fafc;
            --campus-muted: #94a3b8;
            --campus-accent: #38bdf8;
        }

        .campus-page {
            min-height: 100vh;
            padding: 42px clamp(18px, 4vw, 68px) 110px;
            background:
                radial-gradient(circle at 18% 12%, rgba(56, 189, 248, 0.12), transparent 28%),
                radial-gradient(circle at 84% 78%, rgba(168, 85, 247, 0.1), transparent 30%),
                linear-gradient(145deg, #060a13 0%, #0a1120 52%, #07111f 100%);
            color: var(--campus-text);
        }

        .campus-header {
            max-width: 1200px;
            margin: 0 auto 34px;
        }

        .eyebrow {
            margin: 0 0 9px;
            color: var(--campus-accent);
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .campus-heading h1 {
            margin: 0;
            font-size: clamp(2.2rem, 5vw, 4.5rem);
            font-weight: 650;
            letter-spacing: -0.055em;
            line-height: 0.98;
        }

        .campus-intro {
            margin: 15px 0 0;
            color: var(--campus-muted);
            font-size: clamp(0.98rem, 1.6vw, 1.15rem);
            line-height: 1.55;
            max-width: 650px;
        }

        .campus-shell {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ---- Table ---- */
        .poker-table {
            position: relative;
            width: 100%;
            min-height: 600px;
            border-radius: 46%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            background:
                radial-gradient(ellipse at 50% 45%, rgba(56, 189, 248, 0.10), transparent 55%),
                radial-gradient(ellipse at 50% 50%, #0e2130 0%, #0a1621 55%, #060d15 100%),
                repeating-radial-gradient(circle at 20% 30%, rgba(148, 163, 184, 0.035) 0 2px, transparent 2px 46px),
                repeating-radial-gradient(circle at 75% 70%, rgba(148, 163, 184, 0.03) 0 2px, transparent 2px 52px);
            border: 10px solid #1c2b38;
            box-shadow:
                inset 0 0 0 3px rgba(217, 180, 106, 0.16),
                inset 0 0 0 6px rgba(8, 12, 20, 0.6),
                inset 0 20px 80px rgba(0, 0, 0, 0.5),
                0 30px 90px rgba(0, 0, 0, 0.5);
        }

        .table-suits {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
            pointer-events: none;
            opacity: 0.5;
        }

        .table-suits span {
            position: absolute;
            font-size: 30px;
            color: rgba(148, 163, 184, 0.07);
            font-family: Georgia, serif;
        }

        .chip-stack {
            position: absolute;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            pointer-events: none;
        }

        .chip-stack span {
            width: 34px;
            height: 9px;
            border-radius: 50%;
            margin-top: -5px;
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.4), inset 0 0 0 2px rgba(255, 255, 255, 0.18);
        }

        .chip-stack.bottom-left { bottom: 6%; left: 16%; }
        .chip-stack.bottom-right { bottom: 6%; right: 16%; }

        .table-felt-label {
            position: absolute;
            top: 44px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(148, 163, 184, 0.35);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            pointer-events: none;
        }

        /* ---- Playing cards, shared ---- */
        :root {
            --card-w: clamp(78px, 9vw, 128px);
            --card-h: clamp(112px, 12.6vw, 178px);
        }

        .card {
            position: relative;
            width: var(--card-w);
            height: var(--card-h);
            border-radius: 10px;
            flex-shrink: 0;
        }

        .card-back {
            background:
                repeating-linear-gradient(45deg, #b91c1c 0 6px, #9f1616 6px 12px);
            border: 6px solid #f8fafc;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
        }

        .card-back::before {
            content: "";
            position: absolute;
            inset: 6px;
            border: 1.5px solid rgba(248, 250, 252, 0.55);
            border-radius: 4px;
        }

        /* ---- Decorative hands around the table (always on, every size) ---- */
        .hand {
            position: absolute;
            width: var(--card-w);
            height: var(--card-h);
        }

        .hand .card-back {
            position: absolute;
            inset: 0;
            transition: transform 0.4s ease;
        }

        .hand .card-back:nth-child(1) { transform: rotate(var(--r1, -8deg)) translate(-6px, 2px); }
        .hand .card-back:nth-child(2) { transform: rotate(var(--r2, 8deg)) translate(6px, 0); }

        .hand:hover .card-back:nth-child(1) { transform: rotate(var(--r1, -8deg)) translate(-10px, -2px); }
        .hand:hover .card-back:nth-child(2) { transform: rotate(var(--r2, 8deg)) translate(10px, -4px); }

        .hand.pos-top-left      { top: 3%;  left: 3%; }
        .hand.pos-top-right     { top: 3%;  right: 3%; }
        .hand.pos-bottom-left   { bottom: 3%; left: 4%; }
        .hand.pos-bottom-right  { bottom: 3%; right: 4%; }

        /* ---- Community cards (the actual content) ---- */
        .community-row {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            gap: 20px 22px;
            z-index: 3;
        }

        .card-face {
            width: var(--card-w);
            height: var(--card-h);
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            perspective: 1100px;
            transform: rotate(var(--tilt, 0deg)) translateY(var(--lift, 0px));
            transition: transform 0.25s ease;
            font: inherit;
        }

        .card-face:hover:not(.is-flipped),
        .card-face:focus-visible:not(.is-flipped) {
            transform: rotate(var(--tilt, 0deg)) translateY(calc(var(--lift, 0px) - 14px));
            z-index: 8;
            outline: none;
        }

        .card-face.is-flipped {
            transform: rotate(0deg) scale(1.65);
            z-index: 55;
            position: relative;
        }

        @media (max-width: 620px) {
            .card-face.is-flipped { transform: rotate(0deg) scale(1.35); }
        }

        .card-inner {
            display: block;
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card-face.is-flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid rgba(15, 23, 42, 0.12);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            padding: 10px 6px;
        }

        .card-front { justify-content: space-between; }

        .card-back-face {
            transform: rotateY(180deg);
            justify-content: flex-start;
            text-align: left;
            gap: 5px;
            padding: 12px 10px;
        }

        .card-face.is-flipped .card-back-face {
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.55), 0 0 0 2px var(--org-accent, #38bdf8) inset;
        }

        .card-index {
            width: 15px;
            height: 15px;
            color: var(--org-accent, #0f172a);
        }

        .card-index.bottom { align-self: flex-end; transform: rotate(180deg); }

        .card-center-icon {
            width: 50%;
            height: 30%;
            margin: 0 auto;
            color: var(--org-accent, #0f172a);
            overflow: hidden;       /* clip anything that overflows the box */
            border-radius: 6px;     /* optional, rounds the photo's corners */
            flex-shrink: 0;         /* stop flexbox from squishing/stretching it */
        }

        .card-center-icon img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;      /* fills the box, crops instead of distorting */
        }

        .card-name {
            text-align: center;
            font-size: 0.66rem;
            font-weight: 700;
            line-height: 1.2;
            color: #1e293b;
            white-space: normal;
            padding: 0 2px;
        }

        .card-back-icon { width: 24px; height: 24px; color: var(--org-accent, #0f172a); }

        .card-back-category {
            font-size: 0.56rem;
            font-weight: 800;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--org-accent, #0f172a);
        }

        .card-back-title {
            font-size: 0.78rem;
            font-weight: 800;
            line-height: 1.15;
            color: #0f172a;
        }

        .card-back-desc {
            font-size: 0.64rem;
            line-height: 1.35;
            color: #475569;
        }

        .table-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(148, 163, 184, 0.4);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            pointer-events: none;
        }

        .table-scrim {
            position: fixed;
            inset: 0;
            z-index: 40;
            background: rgba(3, 7, 15, 0.72);
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .table-scrim.is-active { opacity: 1; pointer-events: auto; }

        @media (max-width: 900px) {
            .poker-table { min-height: 420px; padding: 34px 8px; border-radius: 30px; }
        }

        @media (max-width: 620px) {
            .campus-page { padding: 28px 14px 96px; }
            .poker-table { min-height: 400px; padding: 26px 6px; }
            .table-hint, .table-felt-label { display: none; }
        }
    </style>
</head>
<body>
    <main class="campus-page">
        <header class="campus-header">
            <div class="campus-heading">
                <h1>UC Berkeley</h1>
                <p class="campus-intro">Four years. Countless memories. </p>
            </div>
        </header>

        <section class="campus-shell">
            <div class="poker-table">
                <div class="table-suits" aria-hidden="true">
                    <span style="top:12%; left:10%;">♠</span>
                    <span style="top:70%; left:6%;">♣</span>
                    <span style="top:18%; right:9%;">♥</span>
                    <span style="top:66%; right:12%;">♦</span>
                    <span style="top:40%; left:44%;">♠</span>
                </div>
                <div class="chip-stack bottom-left" aria-hidden="true">
                    <span style="background:#0e7490;"></span>
                    <span style="background:#7e22ce;"></span>
                    <span style="background:#c2410c;"></span>
                </div>
                <div class="chip-stack bottom-right" aria-hidden="true">
                    <span style="background:#15803d;"></span>
                    <span style="background:#ea580c;"></span>
                    <span style="background:#0e7490;"></span>
                </div>
                <span class="table-felt-label">Activities and Societies</span>
                <div class="hand pos-top-left" style="--r1:-10deg; --r2:6deg;"><div class="card-back"></div><div class="card-back"></div></div>
                <!-- <div class="hand pos-top-center" style="--r1:-6deg; --r2:8deg;"><div class="card-back"></div><div class="card-back"></div></div> -->
                <div class="hand pos-top-right" style="--r1:-8deg; --r2:9deg;"><div class="card-back"></div><div class="card-back"></div></div>
                <!-- <div class="hand pos-mid-left" style="--r1:-9deg; --r2:7deg;"><div class="card-back"></div><div class="card-back"></div></div> -->
                <!-- <div class="hand pos-mid-right" style="--r1:-7deg; --r2:10deg;"><div class="card-back"></div><div class="card-back"></div></div> -->
                <div class="hand pos-bottom-left" style="--r1:-11deg; --r2:5deg;"><div class="card-back"></div><div class="card-back"></div></div>
                <!-- <div class="hand pos-bottom-center" style="--r1:-6deg; --r2:9deg;"><div class="card-back"></div><div class="card-back"></div></div> -->
                <div class="hand pos-bottom-right" style="--r1:-9deg; --r2:6deg;"><div class="card-back"></div><div class="card-back"></div></div>

                <div class="community-row" id="community-row"></div>
                <span class="table-hint">Click a card to learn more</span>
            </div>
        </section>
    </main>

    <div class="table-scrim" id="table-scrim"></div>

    <script src="nav.js"></script>
    <script>
        const organizations = [
            { id: "solar", name: "UC Berkeley Solar Racing Team", shortName: "Solar Racing", description: "Designed and validated battery modules", category: "racing", categoryLabel: "Racing", accent: "#ea580c", image: "media/calsol.jpeg" },
            { id: "robotics", name: "Combat Robotics", shortName: "Combat Robotics", description: "Built drivetrain and winch systems", category: "robotics", categoryLabel: "Robotics", accent: "#c2410c", icon: "robotics" },
            { id: "ieee", name: "IEEE", shortName: "IEEE", description: "Led industry workshops for peers", category: "community", categoryLabel: "Community", accent: "#15803d", icon: "ieee" },
            { id: "esports", name: "Cal Competitive Esports", shortName: "Competitive Esports", description: "Coached teammates through structured practice", category: "competition", categoryLabel: "Competition", accent: "#7e22ce", icon: "esports" },
            { id: "skydeck", name: "Berkeley SkyDeck", shortName: "SkyDeck", description: "Developed tools for aerospace research", category: "research", categoryLabel: "Research", accent: "#0e7490", icon: "skydeck" }
        ];

        const communityRow = document.getElementById("community-row");

        function iconMarkup(icon) {
            const icons = {
                solar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.2 5.2l1.8 1.8M17 17l1.8 1.8M18.8 5.2 17 7M7 17l-1.8 1.8"/></svg>',
                robotics: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6.5 9h11v8h-11zM4 12h2.5M17.5 12H20M8.5 12h.01M15.5 12h.01M9 17v2M15 17v2M12 9V5.5M12 5.5 9.5 3M12 5.5 14.5 3"/><path d="M8 9V6.5A2.5 2.5 0 0 1 10.5 4h3A2.5 2.5 0 0 1 16 6.5V9"/></svg>',
                ieee: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="19" cy="18" r="2.2"/><path d="M7 11l9.5-4M7 13l9.5 4"/></svg>',
                esports: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7.5 7h9a4.5 4.5 0 0 1 4.4 5.4l-.8 3.2a3.4 3.4 0 0 1-6 1.4L13 16h-2l-1.1 1a3.4 3.4 0 0 1-6-1.4l-.8-3.2A4.5 4.5 0 0 1 7.5 7Z"/><path d="M8 10.5v3M6.5 12h3M15.5 10.2h.01M17.8 12.3h.01"/></svg>',
                skydeck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m12 3 7 13-7-3-7 3 7-13Z"/><path d="M12 13v8M8 21h8"/></svg>'
            };
            return icons[icon] || "";
        }

        // Fan math generalizes to any number of cards — add or remove
        // organizations above and this recalculates the spread automatically.
        // Beyond ~7-8 cards the row wraps onto a second centered line.
        const TILT_STEP = 2.4;   // degrees of rotation per step away from center
        const LIFT_CURVE = 1.6;  // how much outer cards dip down vs the center

        const mid = (organizations.length - 1) / 2;
        const tableScrim = document.getElementById("table-scrim");

        communityRow.innerHTML = organizations.map((org, i) => {
            const offset = i - mid;
            const tilt = (offset * TILT_STEP).toFixed(1);
            const lift = (offset * offset * LIFT_CURVE - 4).toFixed(1);
            return `
            <button class="card-face" type="button" data-org="${org.id}" aria-expanded="false"
                style="--tilt:${tilt}deg; --lift:${lift}px; --org-accent:${org.accent};"
                aria-label="${org.name}: ${org.description}">
                <span class="card-inner">
                    <span class="card-front">
                        <span class="card-index">${iconMarkup(org.icon)}</span>
                        <span class="card-center-icon">
                            <img src="${org.image}" alt="${org.name}" /></span>
                        <span class="card-name">${org.shortName}</span>
                        <span class="card-index bottom">${iconMarkup(org.icon)}</span>
                    </span>
                    <span class="card-back-face">
                        <span class="card-back-icon">${iconMarkup(org.icon)}</span>
                        <span class="card-back-category">${org.categoryLabel}</span>
                        <span class="card-back-title">${org.name}</span>
                        <span class="card-back-desc">${org.description}</span>
                    </span>
                </span>
            </button>
        `;
        }).join("");

        // Click a card to pop it out, flipped over, revealing the story.
        // Only one stays open at a time; click it again, click the scrim,
        // or hit Escape to send it back down to the table.
        function closeAll() {
            communityRow.querySelectorAll(".card-face.is-flipped").forEach((c) => {
                c.classList.remove("is-flipped");
                c.setAttribute("aria-expanded", "false");
            });
            tableScrim.classList.remove("is-active");
        }

        communityRow.addEventListener("click", (event) => {
            const card = event.target.closest(".card-face");
            if (!card) return;
            event.stopPropagation();
            const alreadyOpen = card.classList.contains("is-flipped");
            closeAll();
            if (!alreadyOpen) {
                card.classList.add("is-flipped");
                // card.setAttribute("aria-expanded", "true");
                // tableScrim.classList.add("is-active");
            }
        });

        tableScrim.addEventListener("click", closeAll);
        document.addEventListener("click", closeAll);
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") closeAll();
        });
    </script>
</body>
</html>
